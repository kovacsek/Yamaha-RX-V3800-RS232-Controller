  INPUT_HDMI_4:      "7A53"

  # --- DSP MODES ---
  DSP_STRAIGHT:      "7A19"
  DSP_STEREO_2CH:    "7A17"
  DSP_STEREO_7CH:    "7A18"
  DSP_PURE_DIRECT:   "7E2C"

  # --- TUNER CONTROL ---
  TUNER_PRESET_UP:   "7B0C"
