substitutions:
  device_name: yamahars232
  friendly_name: YamahaRS232
  ready_timeout: "000"
  
logger:
  level: DEBUG
  baud_rate: 9600
  
wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: $device_name
    password: !secret fallbackap_password
  manual_ip: 
    static_ip: 192.168.40.62
    subnet: 255.255.255.0
    gateway: 192.168.40.1
    dns1: 192.168.40.1
web_server:

captive_portal:
ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key

mdns:

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # ===== Boot-Init: READY-Handshake gemäß Protokoll =====
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(rxv_config_received) = false;
          id(ready_attempts) = 0;
          id(ready_last_send) = 0;
      - delay: 500ms
      - script.execute: send_ready

globals:
  - id: rxv_config_received
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ready_attempts
    type: int
    restore_value: no
    initial_value: '0'
  - id: ready_last_send
    type: uint32_t
    restore_value: no
    initial_value: '0'

uart:
  id: yamaha_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\r\n"


esp32:
  board: esp32dev
  framework:
    type: esp-idf



# --------------------------------------------------
# POLLER: liest UART, parst ASCII-HEX zwischen STX/ETX
# --------------------------------------------------
interval:
  - interval: 250ms
    then:
      - lambda: |-
          // ------------------------------------------
          // Yamaha RX-V3800 RS232 Parser
          // ------------------------------------------
          static std::string cur, last;
          static uint32_t last_ts = 0;
          const uint32_t now = millis();
          const char* TAG = "yamaha_rs232";

          auto hex_up = [](const std::string &s){
            std::string r; r.reserve(s.size());
            for (char ch: s) {
              char c = (char) toupper((unsigned char) ch);
              if ((c>='0'&&c<='9')||(c>='A'&&c<='F')) r.push_back(c);
            }
            return r;
          };

          auto decode_input = [](const std::string &code) -> const char* {
            struct Entry { const char* code; const char* name; };
            static const Entry entries[] = {
              {"0D", "NET/USB"},
              {"0C", "V-AUX"},
              {"09", "VCR"},
              {"0A", "DVR"},
              {"06", "DTV/CBL"},
              {"05", "DVD"},
              {"11", "BD/HD-DVD"},
              {"04", "MD/TAPE"},
              {"03", "CD-R"},
              {"01", "CD"},
              {"00", "PHONO"},
              {"10", "Multi"},
              {"02", "TUNER"},
            };
            for (const auto &entry : entries) {
              if (code == entry.code) {
                return entry.name;
              }
            }
            return "";
          };

          auto decode_surround_program = [](const std::string &code) -> const char* {
            struct Entry { const char* code; const char* name; };
            static const Entry entries[] = {
              {"34", "2Ch. Stereo"},
              {"17", "7Ch. Stereo"},
              {"44", "Straight Music Enhancer"},
              {"45", "7Ch. Music Enhancer"},
              {"2C", "Surround Decode Pro Logic"},
              {"00", "Classical Hall Munich"},
              {"05", "Classical Hall Vienna"},
              {"07", "Classical Hall Amsterdam"},
              {"09", "Classical Hall Freiburg"},
              {"0B", "Classical Chamber"},
              {"0D", "Live/Club Village Vanguard"},
              {"11", "Live/Club Warehouse Loft"},
              {"0F", "Live/Club Cellar Club"},
              {"10", "Live/Club The Roxy Theater"},
              {"0E", "Live/Club The Bottom Line"},
              {"21", "Entertainment Sports"},
              {"1E", "Entertainment Action Game"},
              {"1F", "Entertainment RPG"},
              {"18", "Entertainment Music Video"},
              {"1C", "Entertainment Recital/Opera"},
              {"2D", "Movie Standard"},
              {"24", "Movie Spectacle"},
              {"25", "Movie Sci-Fi"},
              {"28", "Movie Adventure"},
              {"29", "Movie Drama"},
              {"20", "Movie Mono"},
            };
            for (const auto &entry : entries) {
              if (code == entry.code) {
                return entry.name;
              }
            }
            return "";
          };

          int guard = 0;
          while (id(yamaha_uart).available() && guard++ < 2048) {
            uint8_t b;
            if (!id(yamaha_uart).read_byte(&b)) break;

            // Start (SOH/STX bzw. DC1/DC2) -> neuen Frame beginnen
            if (b == 0x01 || b == 0x02 || b == 0x11 || b == 0x12) {
              cur.clear();
              continue;
            }
            // Ende (03) -> auswerten
            if (b == 0x03) {
              if (cur.empty()) continue;

              std::string raw = cur;
              cur.clear();

              // Debounce
              if (raw == last && (now - last_ts) < 50) { continue; }
              last = raw; last_ts = now;

              std::string raw_upper;
              raw_upper.reserve(raw.size());
              for (char ch : raw) {
                raw_upper.push_back((char) toupper((unsigned char) ch));
              }

              if (!raw_upper.empty()) {
                bool is_start_reply = false;
                if (raw_upper.rfind("CONFIG", 0) == 0) {
                  is_start_reply = true;

                } else if (!id(rxv_config_received) && id(ready_attempts) > 0) {
                  if (raw_upper[0] == 'S') {
                    // Einige Geräte antworten auf READY mit einem "S0…"-Statusblock statt
                    // des in älteren Protokolldokumenten genannten "CONFIG…"-Frames.
                    // Sobald wir während des Handshakes so einen Block sehen, gilt READY
                    // als bestätigt.
                    is_start_reply = true;
                  } else if (raw_upper[0] == 'R' && raw_upper.size() >= 2 && raw_upper[1] >= '0' && raw_upper[1] <= '9') {
                    // RX-V3800 Hardware antwortet mit einem "R0…"-Block (Status Report),
                    // der jedoch ebenfalls unmittelbar nach READY gesendet wird. Akzeptiere
                    // diesen Block als Handshake-Bestätigung, damit das Flag gesetzt wird
                    // und weitere READY-Versuche beendet werden.
                    is_start_reply = true;
                  }

                }

                if (is_start_reply) {
                  id(rxv_config_received) = true;
                  ESP_LOGI(TAG, "RX start response: %s", raw_upper.c_str());
                  id(last_report).publish_state(raw_upper);
                  continue;
                }
              }

              // In bereinigte HEX-Großschrift wandeln
              std::string up = hex_up(raw);
              if (up.size() < 4) continue;

              ESP_LOGV(TAG, "RX frame: %s", up.c_str());
              
              
              // ---------- Standard: RCMD/RDAT extrahieren ----------
              std::string rcmd, rdat;

              // Langform: 33 0x  -> rcmd/rdat bei pos 3/5
              if (up.size() >= 7 && (up[0]=='0'||up[0]=='2'||up[0]=='3') && up[1]=='3' && (up[2]=='0'||up[2]=='1')) {
                rcmd = up.substr(3,2);
                rdat = up.substr(5,2);
              }
              // Kurzform: SW(?), dann rcmd/rdat ab pos 2/4
              else if (up.size() >= 6) {
                rcmd = up.substr(2,2);
                rdat = up.substr(4,2);
              } else {
                id(last_report).publish_state(up.c_str());
                continue;
              }

              id(last_report).publish_state(rcmd + rdat);

              // ---------- Mappings ----------

              // Power States (20) Main/Zone2/Zone3:
              // 00 OFF/OFF/OFF, 01 ON/ON/ON, 02 ON/OFF/OFF, 03 OFF/ON/ON,
              // 04 ON/ON/OFF,   05 ON/OFF/ON, 06 OFF/ON/OFF, 07 OFF/OFF/ON
              if (rcmd == "20") {
                bool main_on = false, z2_on = false, z3_on = false;

                if      (rdat == "00") { main_on=false; z2_on=false; z3_on=false; }
                else if (rdat == "01") { main_on=true;  z2_on=true;  z3_on=true;  }
                else if (rdat == "02") { main_on=true;  z2_on=false; z3_on=false; }
                else if (rdat == "03") { main_on=false; z2_on=true;  z3_on=true;  }
                else if (rdat == "04") { main_on=true;  z2_on=true;  z3_on=false; }
                else if (rdat == "05") { main_on=true;  z2_on=false; z3_on=true;  }
                else if (rdat == "06") { main_on=false; z2_on=true;  z3_on=false; }
                else if (rdat == "07") { main_on=false; z2_on=false; z3_on=true;  }

                id(main_power_state).publish_state(main_on);
                id(zone2_power_state).publish_state(z2_on);
                id(zone3_power_state).publish_state(z3_on);

                id(last_report).publish_state(std::string("20") + rdat);
                continue;
              }

              // Main Inputs (21)
              if (rcmd == "21") {
                const char* name = decode_input(rdat);
                if (*name) id(input_state).publish_state(name);
                continue;
              }
              // ----- MUTE REPORTS -----
              // MAIN MUTE (23): 00 = OFF, 01 = ON
              if (rcmd == "23") {
                const bool on = (rdat == "01");
                id(main_mute_state).publish_state(on);
                continue;
              }
              // Zone2 Inputs (24)
              if (rcmd == "24") {
                const char* name = decode_input(rdat);
                if (*name) id(zone2_input_state).publish_state(name);
                continue;
              }
              // ZONE2 MUTE (25): 00 = OFF, 01 = ON
              if (rcmd == "25") {
                const bool on = (rdat == "01");
                id(zone2_mute_state).publish_state(on);
                continue;
              }
              // ZONE3 MUTE (A1): 00 = OFF, 01 = ON
              if (rcmd == "A1") {
                const bool on = (rdat == "01");
                id(zone3_mute_state).publish_state(on);
                continue;
              }
              // Main Volume (26) – 0x27..0xE8 = -80.0..+16.5 dB (0.5 dB Schritte)
              if (rcmd == "26") {
                int v = strtol(rdat.c_str(), nullptr, 16);          // 0x27..0xE8
                float db = ((float)v - 0x27) * 0.5f - 80.0f;        // 0x27->-80.0, 0xE8->+16.5
                id(volume_state).publish_state(db);
                continue;
              }
              // Zone2 Volume (27) – 0.5 dB Schritte, Offset 0x27 -> -80.0 dB
              if (rcmd == "27") {
                int v = strtol(rdat.c_str(), nullptr, 16);          // 0x27..0xE8
                float db = ((float)v - 0x27) * 0.5f - 80.0f;        // 0x27->-80.0, 0xE8->+16.5
                id(zone2_volume_state).publish_state(db);
                continue;
              }
              // Surround Modes (28)
              if (rcmd == "28") {
                const char* prog = decode_surround_program(rdat);
                if (*prog) id(surround_program_state).publish_state(prog);
                continue;
              }

              // OSD Status (2B)
              if (rcmd == "2B") {
                const char* s = rdat=="00"?"Full" : rdat=="01"?"Short" : rdat=="02"?"Off" : "";
                if (*s) id(osd_state).publish_state(s);
                continue;
              }

            } else {
              // Nutzdaten sammeln
              cur.push_back((char)b);
            }
          }


  - interval: 1s
    then:
      - lambda: |-
          if (id(rxv_config_received)) {
            return;
          }
          if (id(ready_attempts) >= 5) {
            return;
          }
          id(send_ready).execute();



# --------------------------------------------------
# SCRIPTS: Sender
# --------------------------------------------------
script:
  # Start Commands (READY, ...)
  - id: send_start_command
    parameters:
      name: string
      payload: string
    then:
      - lambda: |-
          const char* TAG = "yamaha_rs232";
          auto sanitize_letters = [](const std::string &in) -> std::string {
            std::string out;
            out.reserve(in.size());
            for (char ch : in) {
              char c = (char) toupper((unsigned char) ch);
              if (c >= 'A' && c <= 'Z') {
                out.push_back(c);
              }
            }
            return out;
          };
          auto sanitize_hex = [](const std::string &in) -> std::string {
            std::string out;
            out.reserve(in.size());
            for (char ch : in) {
              char c = (char) toupper((unsigned char) ch);
              if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'F')) {
                out.push_back(c);
              }
            }
            return out;
          };

          std::string header = sanitize_letters(name);
          std::string body = sanitize_hex(payload);

          if (header.empty()) {
            ESP_LOGW(TAG, "Ignoring start command with empty header");
            return;
          }
          if (body.empty()) {
            body = "000";
          }
          if (body.size() < 3) {
            body.insert(body.begin(), 3 - body.size(), '0');
          }

          ESP_LOGD(TAG, "TX start: %s%s", header.c_str(), body.c_str());
          // Start commands such as READY use DC1 (0x11) as frame header according to
          // the RX-Vx800 RS-232C protocol specification. Using STX (0x02) prevents the
          // receiver from answering with the CONFIG frame during the handshake.
          id(yamaha_uart).write_byte(0x11);
          id(yamaha_uart).write_str(header.c_str());
          id(yamaha_uart).write_str(body.c_str());
          id(yamaha_uart).write_byte(0x03);
          id(yamaha_uart).write_str("\r\n");

  - id: send_ready
    then:
      - lambda: |-
          const char* TAG = "yamaha_rs232";
          if (id(rxv_config_received)) {
            ESP_LOGV(TAG, "Skipping READY because configuration is already received");
            return;
          }
          if (id(ready_attempts) >= 5) {
            ESP_LOGW(TAG, "READY handshake attempts exhausted");
            return;
          }

          const uint32_t now = millis();
          if (now - id(ready_last_send) < 900) {
            return;
          }

          id(ready_last_send) = now;
          id(ready_attempts) += 1;
          ESP_LOGI(TAG, "TX start: READY attempt %d", id(ready_attempts));
          id(send_start_command).execute("READY", "${ready_timeout}");

  # Gemeinsamer Rahmenaufbau (STX + SW + Payload + ETX + CR/LF)
  - id: send_frame
    parameters:
      sw: string
      payload: string
    then:
      - lambda: |-
          const char* TAG = "yamaha_rs232";
          if (!id(rxv_config_received) && id(ready_attempts) > 0) {
            ESP_LOGW(TAG, "Sending control frame before READY handshake completed");
          }
          auto sanitize_hex = [](const std::string &in) -> std::string {
            std::string out;
            out.reserve(in.size());
            for (char ch : in) {
              char c = (char) toupper((unsigned char) ch);
              if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'F')) {
                out.push_back(c);
              }
            }
            return out;
          };

          std::string sw_val = sw.empty() ? std::string("0") : sw.substr(0, 1);
          char sw_char = (char) toupper((unsigned char) sw_val[0]);
          if (sw_char != '0' && sw_char != '2' && sw_char != '3') {
            ESP_LOGW(TAG, "Unsupported SW '%c', falling back to remote (0)", sw_char);
            sw_char = '0';
          }

          std::string payload_hex = sanitize_hex(payload);
          if (payload_hex.empty()) {
            ESP_LOGW(TAG, "Ignoring empty payload for SW=%c", sw_char);
            return;
          }
          if ((payload_hex.size() % 2) != 0) {
            ESP_LOGW(TAG, "Odd payload length (%u). Left-padding with 0.", (unsigned) payload_hex.size());
            payload_hex.insert(payload_hex.begin(), '0');
          }

          ESP_LOGD(TAG, "TX SW=%c payload=%s", sw_char, payload_hex.c_str());
          char sw_buf[2] = { sw_char, 0 };

          id(yamaha_uart).write_byte(0x02);
          id(yamaha_uart).write_str(sw_buf);
          id(yamaha_uart).write_str(payload_hex.c_str());
          id(yamaha_uart).write_byte(0x03);
          id(yamaha_uart).write_str("\r\n");

  # SW=0 – „Fernbedienungs“-Befehle (Operation)
  - id: send_op
    parameters:
      code: string        # z. B. "7A1D"
    then:
      - lambda: |-
          id(send_frame).execute("0", code);

  # SW=2 – 2..5 Nibbles am Stück (z. B. "2000" oder "20101" …)
  - id: send_sys
    parameters:
      nibbles: string
    then:
      - lambda: |-
          id(send_frame).execute("2", nibbles);
  - id: send_adv
    parameters:
      code: string
    then:
      - lambda: |-
          id(send_frame).execute("3", code);

  # Absolute Lautstärke main: SW=2, 23 0x
  - id: send_sys_vol_main
    parameters:
      vol_hex: string     # "27".."E8"
    then:
      - lambda: |-
          std::string body = std::string("30") + vol_hex;
          id(send_frame).execute("2", body);

  # Absolute Lautstärke zone2: SW=2, 23 1x
  - id: send_sys_vol_zone2
    parameters:
      vol_hex: string     # "27".."E8"
    then:
      - lambda: |-
          std::string body = std::string("31") + vol_hex;
          id(send_frame).execute("2", body);
# --------------------------------------------------
# UI-ENTITIES (Buttons/Select/Slider)
# --------------------------------------------------
button:
  - platform: template
    name: "All Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7A1D" } ] }
  - platform: template
    name: "All Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7A1E" } ] }
  - platform: template
    name: "Main Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7E7E" } ] }
  - platform: template
    name: "Main Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7E7F" } ] }
  - platform: template
    name: "Main Mute ON"
    icon: "mdi:volume-mute"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA2" } ] }
  - platform: template
    name: "Main Mute OFF"
    icon: "mdi:volume-high"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA3" } ] }
  - platform: template
    name: "Main Mute Toggle"
    icon: mdi:volume-variant
    on_press:
      - if:
          condition:
            binary_sensor.is_on: main_mute_state
          then:
            - script.execute: { id: send_op, code: "7EA3" }
          else:
            - script.execute: { id: send_op, code: "7EA2" }

  - platform: template
    name: "Zone2 Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7EBA" } ] }
  - platform: template
    name: "Zone2 Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7EBB" } ] }
  - platform: template
    name: "Zone2 Mute ON"
    icon: "mdi:volume-mute"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA0" } ] }
  - platform: template
    name: "Zone2 Mute OFF"
    icon: "mdi:volume-high"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA1" } ] }
  - platform: template
    name: "Zone2 Mute Toggle"
    icon: mdi:volume-variant
    on_press:
      - if:
          condition:
            binary_sensor.is_on: zone2_mute_state
          then:
            - script.execute: { id: send_op, code: "7EA1" }   # war ON -> OFF
          else:
            - script.execute: { id: send_op, code: "7EA0" }   # war OFF -> ON

  - platform: template
    name: "Zone3 Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7AED" } ] }
  - platform: template
    name: "Zone3 Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7AEE" } ] }
  - platform: template
    name: "Zone3 Mute ON"
    icon: "mdi:volume-mute"
    on_press: { then: [ script.execute: { id: send_op, code: "7E26" } ] }
  - platform: template
    name: "Zone3 Mute OFF"
    icon: "mdi:volume-high"
    on_press: { then: [ script.execute: { id: send_op, code: "7E66" } ] }
  - platform: template
    name: "All Zones Mute Toggle"
    icon: mdi:volume-off
    on_press:
      - if:
          condition:
            or:
              - binary_sensor.is_on: main_mute_state
              - binary_sensor.is_on: zone2_mute_state
              - binary_sensor.is_on: zone3_mute_state
          then:
            # wenn irgendwas gemutet ist → alles entmuten
            - script.execute: { id: send_op, code: "7EA3" }   # Main OFF
            - delay: 100ms
            - script.execute: { id: send_op, code: "7EA1" }   # Zone2 OFF
            - delay: 100ms
            - script.execute: { id: send_op, code: "7E66" }   # Zone3 OFF
          else:
            # sonst alles muten
            - script.execute: { id: send_op, code: "7EA2" }   # Main ON
            - delay: 100ms
            - script.execute: { id: send_op, code: "7EA0" }   # Zone2 ON
            - delay: 100ms
            - script.execute: { id: send_op, code: "7E26" }   # Zone3 ON
            
  - platform: template
    name: "GUI Top Menu"
    on_press: { then: [ script.execute: { id: send_op, code: "7AA0" } ] }
  - platform: template
    name: "GUI Cursor Up"
    on_press: { then: [ script.execute: { id: send_op, code: "7A9D" } ] }
  - platform: template
    name: "GUI Cursor Left"
    on_press: { then: [ script.execute: { id: send_op, code: "7A9F" } ] }
  - platform: template
    name: "GUI Cursor Right"
    on_press: { then: [ script.execute: { id: send_op, code: "7A9E" } ] }
  - platform: template
    name: "GUI Cursor Down"
    on_press: { then: [ script.execute: { id: send_op, code: "7A9C" } ] }
  - platform: template
    name: "GUI Enter"
    on_press: { then: [ script.execute: { id: send_op, code: "7ADE" } ] }
  - platform: template
    name: "GUI Exit"
    on_press: { then: [ script.execute: { id: send_op, code: "7AA1" } ] }

  # NET/USB control surface
  - platform: template
    name: "NET/USB Menu"
    on_press: { then: [ script.execute: { id: send_op, code: "0F7F012FD0" } ] }
  - platform: template
    name: "NET/USB Enter"
    on_press: { then: [ script.execute: { id: send_op, code: "0F7F0131CE" } ] }
  - platform: template
    name: "NET/USB Display"
    on_press: { then: [ script.execute: { id: send_op, code: "0F7F0135CA" } ] }
  - platform: template
    name: "NET/USB Cursor Up"
    on_press: { then: [ script.execute: { id: send_op, code: "0F7F012ED1" } ] }
  - platform: template
    name: "NET/USB Cursor Down"
    on_press: { then: [ script.execute: { id: send_op, code: "0F7F0134CB" } ] }
  - platform: template
    name: "NET/USB Cursor Left"
