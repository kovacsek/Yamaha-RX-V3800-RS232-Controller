text:
  - platform: template
    id: yamaha_cmd_text
    name: "Yamaha RS232 Body (HEX)"
    optimistic: true
    min_length: 2
    max_length: 16
    mode: text
number:
  - platform: template
    id: main_volume_abs
    name: "Main Volume (abs)"
    unit_of_measurement: "dB"
    min_value: -80.0
    max_value: 16.5
    step: 0.5
    mode: slider
    set_action:
      - lambda: |-
          // Ziel-dB clampen
          float db = x;
          if (db < -80.0f) db = -80.0f;
          if (db >  16.5f) db =  16.5f;

          // RX-V3800: val = round((db + 80.0)/0.5) + 0x27
          int val = (int) lroundf((db + 80.0f) / 0.5f) + 0x27;

          // Sicherheitsbereich 0x27..0xE8
          if (val < 0x27) val = 0x27;
          if (val > 0xE8) val = 0xE8;

          char hexv[3];
          sprintf(hexv, "%02X", val);   // -80.0 -> 27, -79.5 -> 28, ..., +16.5 -> E8
          id(send_sys_vol_main).execute(std::string(hexv));

  - platform: template
    id: zone2_volume_abs
    name: "Zone2 Volume (abs)"
    unit_of_measurement: "dB"
    min_value: -80.0
    max_value: 16.5
    step: 0.5
    mode: slider
    set_action:
      - lambda: |-
          // Ziel-dB clampen
          float db = x;
          if (db < -80.0f) db = -80.0f;
          if (db >  16.5f) db =  16.5f;

          // 0.5-dB Raster auf Protokollwert abbilden:
          // val = round((db + 80.0)/0.5) + 0x27
          int val = (int) lroundf((db + 80.0f) / 0.5f) + 0x27;

          // Sicherheitsbegrenzung auf zulässigen Bereich 0x27..0xE8
          if (val < 0x27) val = 0x27;
          if (val > 0xE8) val = 0xE8;

          char hexv[3];
          sprintf(hexv, "%02X", val);   // z.B. -80.0 -> 27, -79.5 -> 28, ... , +16.5 -> E8
          id(send_sys_vol_zone2).execute(std::string(hexv));
select:
  - platform: template
    id: main_input_select
    name: "Main Input"
    optimistic: false
    options: ["PHONO","CD","TUNER","CD-R","MD/TAPE","BD/HD-DVD","DVD","DTV/CBL","VCR","DVR","V-AUX","NET/USB","Multi"]
    set_action:
      - lambda: |-
          std::string s = x, cmd;
          if (s=="PHONO") cmd="7A14";
          else if (s=="CD") cmd="7A15";
          else if (s=="TUNER") cmd="7A16";
          else if (s=="CD-R") cmd="7A19";
          else if (s=="MD/TAPE") cmd="7A18";
          else if (s=="BD/HD-DVD") cmd="7AC8";
          else if (s=="DVD") cmd="7AC1";
          else if (s=="DTV/CBL") cmd="7A54";
          else if (s=="VCR") cmd="7A0F";
          else if (s=="DVR") cmd="7A13";
          else if (s=="V-AUX") cmd="7A55";
          else if (s=="NET/USB") cmd="0F7F013FC0";
          else if (s=="Multi") cmd="7A87";
          if (!cmd.empty()) id(send_op).execute(cmd);

  - platform: template
    id: zone2_input_select
    name: "Zone2 Input"
    optimistic: false
    options: ["PHONO","CD","TUNER","CD-R","MD/TAPE","BD/HD-DVD","DVD","DTV/CBL","VCR","DVR","V-AUX","NET/USB"]
    set_action:
