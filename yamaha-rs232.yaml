    options: ["OFF","ON"]
    set_action:
      - lambda: |-
          std::string s = x, cmd;
          if (s=="OFF") cmd="9A00";
          else if (s=="ON") cmd="9A01";
          if (!cmd.empty()) id(send_sys).execute(cmd);
