# ==========================================================
# CONNECTION SETTINGS
# ==========================================================
connection:
  serial_port: "/dev/ttyS0"
  baud_rate: 9600
  tcp_port: 9999
  host: "0.0.0.0"

# ==========================================================
# FUNCTION MAP - COMMANDS
# Maps friendly names to command hex values
# ==========================================================
functions:

  # --- POWER ---
  POWER_ON:          "7E7E"
  POWER_OFF:         "7E7F"
  POWER_TOGGLE:      "7E80"
  ZONE2_POWER_ON:    "7EBA"
  ZONE2_POWER_OFF:   "7EBB"
  ZONE3_POWER_ON:    "7EB4"
  ZONE3_POWER_OFF:   "7EB5"

  # --- VOLUME & MUTE ---
  MAIN_VOL_UP:       "7A1A"
  MAIN_VOL_DOWN:     "7A1B"
  MUTE_KEY:          "7A1C"
  MUTE_ON:           "7A1D"
  MUTE_OFF:          "7A1E"


  # --- INPUTS (Main Zone) ---
  INPUT_PHONO:       "7A14"
  INPUT_CD:          "7A15"
  INPUT_TUNER:       "7A16"
  INPUT_CD_R:        "7A19"
  INPUT_MD_TAPE:     "7A18"
  INPUT_BD_HD_DVD:   "7AC8"
