substitutions:
  device_name: yamahars232
  friendly_name: YamahaRS232
  
logger:
  level: DEBUG
  baud_rate: 9600
  
wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: $device_name
    password: !secret fallbackap_password

web_server:

captive_portal:
ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key

mdns:

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # ===== Boot-Init: Reports aktivieren & Delay setzen =====
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(_boot_ms) = millis();
      - delay: 1s
      # Optionaler Status-Pull (Operation): 7A7F
      - script.execute: { id: send_op, code: "7A7F" }
      - script.execute: { id: send_op, code: "7A7F" }

uart:
  id: yamaha_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\r\n"


esp32:
  board: esp32dev
  framework:
    type: esp-idf



# --------------------------------------------------
# Helfer: Startzeit für sanften Poller
# --------------------------------------------------
globals:
  - id: start_ms
    type: uint32_t
    initial_value: "0"
# ===== Globale Helfer =====

  - id: _boot_ms
    type: uint32_t
    initial_value: '0'
# --------------------------------------------------
# POLLER: liest UART, parst ASCII-HEX zwischen STX/ETX
# --------------------------------------------------
interval:
  - interval: 250ms
    then:
      - lambda: |-
          // ------------------------------------------
          // Yamaha RX-V3800 RS232 Parser
          // ------------------------------------------
          static std::string cur, last;
          static uint32_t last_ts = 0;
          const uint32_t now = millis();

          auto is_hex = [](char c){ return (c>='0'&&c<='9')||(c>='A'&&c<='F'); };
          auto hex_up = [](const std::string &s){
            std::string r; r.reserve(s.size());
            for (char ch: s) {
              char c = (char) toupper((unsigned char) ch);
              if ((c>='0'&&c<='9')||(c>='A'&&c<='F')) r.push_back(c);
            }
            return r;
          };

          auto decode_input = [](const std::string &code) -> const char* {
            struct Entry { const char* code; const char* name; };
            static const Entry entries[] = {
              {"0D", "Net/USB"},
              {"0C", "V-Aux"},
              {"09", "VCR"},
              {"0A", "DVR"},
              {"06", "DTV/CBL"},
              {"05", "DVD"},
              {"11", "BD/HD-DVD"},
              {"04", "MD/TAPE"},
              {"03", "CD-R"},
              {"01", "CD"},
              {"00", "PHONO"},
              {"10", "Multi"},
              {"02", "Tuner"},
            };
            for (const auto &entry : entries) {
              if (code == entry.code) {
                return entry.name;
              }
            }
            return "";
          };

          auto decode_surround_program = [](const std::string &code) -> const char* {
            struct Entry { const char* code; const char* name; };
            static const Entry entries[] = {
              {"34", "2Ch. Stereo"},
              {"17", "7Ch. Stereo"},
              {"44", "Straight Music Enhancer"},
              {"45", "7Ch. Music Enhancer"},
              {"2C", "Surround Decode Pro Logic"},
              {"00", "Classical Hall Munich"},
              {"05", "Classical Hall Vienna"},
              {"07", "Classical Hall Amsterdam"},
              {"09", "Classical Hall Freiburg"},
              {"0B", "Classical Chamber"},
              {"0D", "Live/Club Village Vanguard"},
              {"11", "Live/Club Warehouse Loft"},
              {"0F", "Live/Club Cellar Club"},
              {"10", "Live/Club The Roxy Theater"},
              {"0E", "Live/Club The Bottom Line"},
              {"21", "Entertainment Sports"},
              {"1E", "Entertainment Action Game"},
              {"1F", "Entertainment RPG"},
              {"18", "Entertainment Music Video"},
              {"1C", "Entertainment Recital/Opera"},
              {"2D", "Movie Standard"},
              {"24", "Movie Spectacle"},
              {"25", "Movie Sci-Fi"},
              {"28", "Movie Adventure"},
              {"29", "Movie Drama"},
              {"20", "Movie Mono"},
            };
            for (const auto &entry : entries) {
              if (code == entry.code) {
                return entry.name;
              }
            }
            return "";
          };

          int guard = 0;
          while (id(yamaha_uart).available() && guard++ < 2048) {
            uint8_t b;
            if (!id(yamaha_uart).read_byte(&b)) break;

            // Start (01 oder 02) -> neuen Frame beginnen
            if (b == 0x01 || b == 0x02) { cur.clear(); continue; }
            // Ende (03) -> auswerten
            if (b == 0x03) {
              if (cur.empty()) continue;

              // Debounce
              if (cur == last && (now - last_ts) < 50) { cur.clear(); continue; }
              last = cur; last_ts = now;

              // In bereinigte HEX-Großschrift wandeln
              std::string up = hex_up(cur);
              cur.clear();
              if (up.size() < 4) continue;
              
              
              // ---------- Standard: RCMD/RDAT extrahieren ----------
              std::string rcmd, rdat;

              // Langform: 33 0x  -> rcmd/rdat bei pos 3/5
              if (up.size() >= 7 && (up[0]=='0'||up[0]=='2'||up[0]=='3') && up[1]=='3' && (up[2]=='0'||up[2]=='1')) {
                rcmd = up.substr(3,2);
                rdat = up.substr(5,2);
              }
              // Kurzform: SW(?), dann rcmd/rdat ab pos 2/4
              else if (up.size() >= 6) {
                rcmd = up.substr(2,2);
                rdat = up.substr(4,2);
              } else {
                id(last_report).publish_state(up.c_str());
                continue;
              }

              id(last_report).publish_state(rcmd + rdat);

              // ---------- Mappings ----------

              // Power States (20) Main/Zone2/Zone3:
              // 00 OFF/OFF/OFF, 01 ON/ON/ON, 02 ON/OFF/OFF, 03 OFF/ON/ON,
              // 04 ON/ON/OFF,   05 ON/OFF/ON, 06 OFF/ON/OFF, 07 OFF/OFF/ON
              if (rcmd == "20") {
                bool main_on = false, z2_on = false, z3_on = false;

                if      (rdat == "00") { main_on=false; z2_on=false; z3_on=false; }
                else if (rdat == "01") { main_on=true;  z2_on=true;  z3_on=true;  }
                else if (rdat == "02") { main_on=true;  z2_on=false; z3_on=false; }
                else if (rdat == "03") { main_on=false; z2_on=true;  z3_on=true;  }
                else if (rdat == "04") { main_on=true;  z2_on=true;  z3_on=false; }
                else if (rdat == "05") { main_on=true;  z2_on=false; z3_on=true;  }
                else if (rdat == "06") { main_on=false; z2_on=true;  z3_on=false; }
                else if (rdat == "07") { main_on=false; z2_on=false; z3_on=true;  }

                id(main_power_state).publish_state(main_on);
                id(zone2_power_state).publish_state(z2_on);
                id(zone3_power_state).publish_state(z3_on);

                id(last_report).publish_state(std::string("20") + rdat);
                continue;
              }

              // Main Inputs (21)
              if (rcmd == "21") {
                const char* name = decode_input(rdat);
                if (*name) id(input_state).publish_state(name);
                continue;
              }
              // ----- MUTE REPORTS -----
              // MAIN MUTE (23): 00 = OFF, 01 = ON
              if (rcmd == "23") {
                const bool on = (rdat == "01");
                id(main_mute_state).publish_state(on);
                continue;
              }
              // Zone2 Inputs (24)
              if (rcmd == "24") {
                const char* name = decode_input(rdat);
                if (*name) id(zone2_input_state).publish_state(name);
                continue;
              }
              // ZONE2 MUTE (25): 00 = OFF, 01 = ON
              if (rcmd == "25") {
                const bool on = (rdat == "01");
                id(zone2_mute_state).publish_state(on);
                continue;
              }
              // ZONE3 MUTE (A1): 00 = OFF, 01 = ON
              if (rcmd == "A1") {
                const bool on = (rdat == "01");
                id(zone3_mute_state).publish_state(on);
                continue;
              }
              // Main Volume (26) – 0x27..0xE8 = -80.0..+16.5 dB (0.5 dB Schritte)
              if (rcmd == "26") {
                int v = strtol(rdat.c_str(), nullptr, 16);          // 0x27..0xE8
                float db = ((float)v - 0x27) * 0.5f - 80.0f;        // 0x27->-80.0, 0xE8->+16.5
                id(volume_state).publish_state(db);
                continue;
              }
              // Zone2 Volume (27) – 0.5 dB Schritte, Offset 0x27 -> -80.0 dB
              if (rcmd == "27") {
                int v = strtol(rdat.c_str(), nullptr, 16);          // 0x27..0xE8
                float db = ((float)v - 0x27) * 0.5f - 80.0f;        // 0x27->-80.0, 0xE8->+16.5
                id(zone2_volume_state).publish_state(db);
                continue;
              }
              // Surround Modes (28)
              if (rcmd == "28") {
                const char* prog = decode_surround_program(rdat);
                if (*prog) id(surround_program_state).publish_state(prog);
                continue;
              }

              // OSD Status (2B)
              if (rcmd == "2B") {
                const char* s = rdat=="00"?"Full" : rdat=="01"?"Short" : rdat=="02"?"Off" : "";
                if (*s) id(osd_state).publish_state(s);
                continue;
              }

            } else {
              // Nutzdaten sammeln
              cur.push_back((char)b);
            }
          }



# --------------------------------------------------
# SCRIPTS: Sender
# --------------------------------------------------
script:
  # SW=0 – „Fernbedienungs“-Befehle (Operation)
  - id: send_op
    parameters:
      code: string        # z. B. "7A1D"
    then:
      - lambda: |-
          id(yamaha_uart).write_byte(0x02);
          id(yamaha_uart).write_str("0");
          id(yamaha_uart).write_str(code.c_str());
          id(yamaha_uart).write_byte(0x03);

  # SW=2 – 2..5 Nibbles am Stück (z. B. "2000" oder "20101" …)
  - id: send_sys
    parameters:
      nibbles: string
    then:
      - lambda: |-
          id(yamaha_uart).write_byte(0x02);
          id(yamaha_uart).write_str("2");
          id(yamaha_uart).write_str(nibbles.c_str());
          id(yamaha_uart).write_byte(0x03);
  - id: send_adv
    parameters:
      code: string
    then:
      - lambda: |-
          id(yamaha_uart).write_byte(0x02);   // STX
          id(yamaha_uart).write_str("3");     // SW = 3 (Advanced)
          id(yamaha_uart).write_str(code.c_str());
          id(yamaha_uart).write_byte(0x03);   // ETX

  # Absolute Lautstärke main: SW=2, 23 0x
  - id: send_sys_vol_main
    parameters:
      vol_hex: string     # "01".."C7"
    then:
      - lambda: |-
          id(yamaha_uart).write_byte(0x02);
          id(yamaha_uart).write_str("2");
          id(yamaha_uart).write_str("30");       // '23' + '0'
          id(yamaha_uart).write_str(vol_hex.c_str());
          id(yamaha_uart).write_byte(0x03);

  # Absolute Lautstärke zone2: SW=2, 23 1x
  - id: send_sys_vol_zone2
    parameters:
      vol_hex: string     # "01".."50"
    then:
      - lambda: |-
          id(yamaha_uart).write_byte(0x02);
          id(yamaha_uart).write_str("2");
          id(yamaha_uart).write_str("31");       // '23' + '1'
          id(yamaha_uart).write_str(vol_hex.c_str());
          id(yamaha_uart).write_byte(0x03);


# --------------------------------------------------
# UI-ENTITIES (Buttons/Select/Slider)
# --------------------------------------------------
button:
  - platform: template
    name: "All Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7A1D" } ] }
  - platform: template
    name: "All Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7A1E" } ] }
  - platform: template
    name: "Main Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7E7E" } ] }
  - platform: template
    name: "Main Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7E7F" } ] }
  - platform: template
    name: "Main Mute ON"
    icon: "mdi:volume-mute"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA2" } ] }
  - platform: template
    name: "Main Mute OFF"
    icon: "mdi:volume-high"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA3" } ] }
  - platform: template
    name: "Main Mute Toggle"
    icon: mdi:volume-variant
    on_press:
      - if:
          condition:
            binary_sensor.is_on: main_mute_state
          then:
            - script.execute: { id: send_op, code: "7EA3" }
          else:
            - script.execute: { id: send_op, code: "7EA2" }

  - platform: template
    name: "Zone2 Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7EBA" } ] }
  - platform: template
    name: "Zone2 Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7EBB" } ] }
  - platform: template
    name: "Zone2 Mute ON"
    icon: "mdi:volume-mute"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA0" } ] }
  - platform: template
    name: "Zone2 Mute OFF"
    icon: "mdi:volume-high"
    on_press: { then: [ script.execute: { id: send_op, code: "7EA1" } ] }
  - platform: template
    name: "Zone2 Mute Toggle"
    icon: mdi:volume-variant
    on_press:
      - if:
          condition:
            binary_sensor.is_on: zone2_mute_state
          then:
            - script.execute: { id: send_op, code: "7EA1" }   # war ON -> OFF
          else:
            - script.execute: { id: send_op, code: "7EA0" }   # war OFF -> ON

  - platform: template
    name: "Zone3 Power ON"
    on_press: { then: [ script.execute: { id: send_op, code: "7AED" } ] }
  - platform: template
    name: "Zone3 Power OFF"
    on_press: { then: [ script.execute: { id: send_op, code: "7AEE" } ] }
  - platform: template
    name: "Zone3 Mute ON"
    icon: "mdi:volume-mute"
    on_press: { then: [ script.execute: { id: send_op, code: "7E26" } ] }
  - platform: template
    name: "Zone3 Mute OFF"
    icon: "mdi:volume-high"
    on_press: { then: [ script.execute: { id: send_op, code: "7E66" } ] }
  - platform: template
    name: "All Zones Mute Toggle"
    icon: mdi:volume-off
    on_press:
      - if:
          condition:
            or:
              - binary_sensor.is_on: main_mute_state
              - binary_sensor.is_on: zone2_mute_state
              - binary_sensor.is_on: zone3_mute_state
          then:
            # wenn irgendwas gemutet ist → alles entmuten
            - script.execute: { id: send_op, code: "7EA3" }   # Main OFF
            - delay: 100ms
            - script.execute: { id: send_op, code: "7EA1" }   # Zone2 OFF
            - delay: 100ms
            - script.execute: { id: send_op, code: "7E66" }   # Zone3 OFF
          else:
            # sonst alles muten
            - script.execute: { id: send_op, code: "7EA2" }   # Main ON
            - delay: 100ms
            - script.execute: { id: send_op, code: "7EA0" }   # Zone2 ON
            - delay: 100ms
            - script.execute: { id: send_op, code: "7E26" }   # Zone3 ON
            
  - platform: template
    name: "OSD On Screen"
    on_press: { then: [ script.execute: { id: send_op, code: "7A7E" } ] }
  - platform: template
    name: "OSD Cursor Up"
    on_press: { then: [ script.execute: { id: send_op, code: "7A7B" } ] }
  - platform: template
    name: "OSD Cursor Down"
    on_press: { then: [ script.execute: { id: send_op, code: "7A7C" } ] }
  - platform: template
    name: "OSD Cursor Left"
    on_press: { then: [ script.execute: { id: send_op, code: "7A7A" } ] }
  - platform: template
    name: "OSD Cursor Right"
    on_press: { then: [ script.execute: { id: send_op, code: "7A7D" } ] }
  - platform: template
    name: "OSD Enter"
    on_press: { then: [ script.execute: { id: send_op, code: "7A79" } ] }
  - platform: template
    name: "OSD Return"
    on_press: { then: [ script.execute: { id: send_op, code: "7A78" } ] }
  - platform: template
    name: "OSD Off"
    on_press: { then: [ script.execute: { id: send_op, code: "7EB0" } ] }
  - platform: template
    name: "OSD Short"
    on_press: { then: [ script.execute: { id: send_op, code: "7EB1" } ] }
  - platform: template
    name: "OSD Full"
    on_press: { then: [ script.execute: { id: send_op, code: "7EB2" } ] }

  - platform: template
    name: "Send OP (SW=0) – from text"
    icon: mdi:send
    on_press:
      - lambda: |-
          id(send_op).execute(id(yamaha_cmd_text).state);
  - platform: template
    name: "Send SYS (SW=2) – from text"
    icon: mdi:send
    on_press:
      - lambda: |-
          id(send_sys).execute(id(yamaha_cmd_text).state);
  - platform: template
    name: "Send ADV (SW=3) – from text"
    icon: mdi:send
    on_press:
      - lambda: |-
          id(send_adv).execute(id(yamaha_cmd_text).state);
text:
  - platform: template
    id: yamaha_cmd_text
    name: "Yamaha RS232 Body (HEX)"
    optimistic: true
    min_length: 2
    max_length: 16
    mode: text
number:
  - platform: template
    id: main_volume_abs
    name: "Main Volume (abs)"
    unit_of_measurement: "dB"
    min_value: -80.0
    max_value: 16.5
    step: 0.5
    mode: slider
    set_action:
      - lambda: |-
          // Ziel-dB clampen
          float db = x;
          if (db < -80.0f) db = -80.0f;
          if (db >  16.5f) db =  16.5f;

          // RX-V3800: val = round((db + 80.0)/0.5) + 0x27
          int val = (int) lroundf((db + 80.0f) / 0.5f) + 0x27;

          // Sicherheitsbereich 0x27..0xE8
          if (val < 0x27) val = 0x27;
          if (val > 0xE8) val = 0xE8;

          char hexv[3];
          sprintf(hexv, "%02X", val);   // -80.0 -> 27, -79.5 -> 28, ..., +16.5 -> E8
          id(send_sys_vol_main).execute(std::string(hexv));

  - platform: template
    id: zone2_volume_abs
    name: "Zone2 Volume (abs)"
    unit_of_measurement: "dB"
    min_value: -80.0
    max_value: 16.5
    step: 0.5
    mode: slider
    set_action:
      - lambda: |-
          // Ziel-dB clampen
          float db = x;
          if (db < -80.0f) db = -80.0f;
          if (db >  16.5f) db =  16.5f;

          // 0.5-dB Raster auf Protokollwert abbilden:
          // val = round((db + 80.0)/0.5) + 0x27
          int val = (int) lroundf((db + 80.0f) / 0.5f) + 0x27;

          // Sicherheitsbegrenzung auf zulässigen Bereich 0x27..0xE8
          if (val < 0x27) val = 0x27;
          if (val > 0xE8) val = 0xE8;

          char hexv[3];
          sprintf(hexv, "%02X", val);   // z.B. -80.0 -> 27, -79.5 -> 28, ... , +16.5 -> E8
          id(send_sys_vol_zone2).execute(std::string(hexv));
select:
  - platform: template
    id: main_input_select
    name: "Main Input"
    optimistic: false
    options: ["PHONO","CD","TUNER","CD-R","MD/TAPE","BD/HD-DVD","DVD","DTV/CBL","VCR","DVR","V-AUX"]
    set_action:
      - lambda: |-
          std::string s = x, cmd;
          if (s=="PHONO") cmd="7A14";
          else if (s=="CD") cmd="7A15";
          else if (s=="TUNER") cmd="7A16";
          else if (s=="CD-R") cmd="7A19";
          else if (s=="MD/TAPE") cmd="7AC9";
          else if (s=="BD/HD-DVD") cmd="7AC8";
          else if (s=="DVD") cmd="7AC1";
          else if (s=="DTV/CBL") cmd="7A54";
          else if (s=="VCR") cmd="7A0F";
          else if (s=="DVR") cmd="7A13";
          else if (s=="V-AUX") cmd="7A55";
          if (!cmd.empty()) id(send_op).execute(cmd);

  - platform: template
    id: zone2_input_select
    name: "Zone2 Input"
    optimistic: false
    options: ["PHONO","CD","TUNER","CD-R","MD/TAPE","DVD","DTV/CBL","VCR","DVR","V-AUX"]
    set_action:
      - lambda: |-
          std::string s = x, cmd;
          if (s=="PHONO") cmd="7AD0";
          else if (s=="CD") cmd="7AD1";
          else if (s=="TUNER") cmd="7AD2";
          else if (s=="CD-R") cmd="7AD4";
          else if (s=="MD/TAPE") cmd="7ACF";
          else if (s=="DVD") cmd="7ACD";
          else if (s=="DTV/CBL") cmd="7AD9";
          else if (s=="VCR") cmd="7AD6";
          else if (s=="DVR") cmd="7AD7";
          else if (s=="V-AUX") cmd="7AD8";
          if (!cmd.empty()) id(send_op).execute(cmd);

# --------------------------------------------------
# STATES (vom Parser gesetzt) + OSD-Text
# --------------------------------------------------
binary_sensor:
  - platform: template
    id: main_power_state
    name: "Main Power State"
    device_class: power

  - platform: template
    id: zone2_power_state
    name: "Zone2 Power State"
    device_class: power

  - platform: template
    id: zone3_power_state
    name: "Zone3 Power State"
    device_class: power

  - platform: template
    id: main_mute_state
    name: "Main Mute State"

  - platform: template
    id: zone2_mute_state
    name: "Zone2 Mute State"

  - platform: template
    id: zone3_mute_state
    name: "Zone3 Mute State"

sensor:
  - platform: template
    id: volume_state
    name: "Main Volume State"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: 'id(main_volume_abs).publish_state(x);'

  - platform: template
    id: zone2_volume_state
    name: "Zone2 Volume State"
    unit_of_measurement: "dB"
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: 'id(zone2_volume_abs).publish_state(x);'

text_sensor:
  - platform: template
    id: input_state
    name: "Main Input State"
    on_value:
      then:
        - lambda: |-
